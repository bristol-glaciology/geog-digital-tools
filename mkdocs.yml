site_name: Geog Digital Tools & Infrastructure Workshop Series
site_description: Open-source tools for outreach, teaching, and research documentation — Bristol Glaciology Centre
site_author: Bristol Glaciology Centre
site_url: https://bristol-glaciology.github.io/geog-digital-tools/

repo_url: https://github.com/bristol-glaciology/geog-digital-tools
repo_name: Source code

theme:
  name: material
  logo: img/logo.png
  favicon: img/favicon.png
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Source Sans 3
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tooltips
    - toc.follow

copyright: >
  &copy; Bristol Glaciology Centre —
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a>

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bristol-glaciology
      name: Bristol Glaciology Centre on GitHub
    - icon: fontawesome/solid/globe
      link: https://bristol-glaciology.github.io
      name: Bristol Glaciology Centre website

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search

nav:
  - Home: index.md
  - Workshop 1: workshop-1/index.md
