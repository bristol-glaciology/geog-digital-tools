# Site settings
title: "My Static Website"
subtitle: "Jekyll / Minimal Mistakes Example"
description: >-
  This is a very bare-bones example website to show you how you might take 
  the same content - written in a mix of Markdown and Jupyter - and present 
  it using a variety of static site generators.
url: "https://example.com"
baseurl: ""
repository: ""

# Minimal Mistakes theme
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "default"

# Site author
author:
  name: "Author Name"
  bio: "Digital Tools Example"
  avatar: "/assets/images/logo.png"
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://example.com"

# Masthead
logo: "/assets/images/logo.png"

# Footer
footer_links:
  - label: "Website"
    icon: "fas fa-fw fa-link"
    url: "https://example.com"

# Navigation (these appear in the header)
# Minimal Mistakes will automatically pick up pages in root with front matter
# We use a custom include to create the nav
breadcrumbs: true

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Markdown
markdown: kramdown
kramdown:
  math_engine: mathjax

# Pagination
paginate: 5
paginate_path: /page:num/

# Search
search: true
search_full_content: true

# Exclude from processing
exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - README.md
  - CHANGELOG.md
  - LICENSE
